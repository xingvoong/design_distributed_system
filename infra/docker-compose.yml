x-build: &build
  build:
    context: ..
    dockerfile: Dockerfile

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_NAME: document-jobs

x-db-env: &db-env
  DATABASE_URL: postgresql://docflow:docflow@postgres:5432/docflow

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *build
    working_dir: /app/packages/db
    command: npx prisma migrate deploy
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai-inference:
    <<: *build
    working_dir: /app/services/ai-inference
    command: node dist/index.js
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
    # No real API key — primary will fail, circuit opens, fallback (stub) takes over

  pipeline-coordinator:
    <<: *build
    working_dir: /app/services/pipeline-coordinator
    command: node dist/index.js
    ports:
      - "3002:3002"
    environment:
      <<: *redis-env
      NODE_ID: coordinator-1
      HEALTH_PORT: "3002"
    depends_on:
      redis:
        condition: service_healthy

  ingest-service:
    <<: *build
    working_dir: /app/services/ingest-service
    command: node dist/index.js
    ports:
      - "3004:3004"
    volumes:
      - uploads:/uploads
    environment:
      PORT: "3004"
      COORDINATOR_URL: http://pipeline-coordinator:3002
      STORAGE_BASE: /uploads
    depends_on:
      pipeline-coordinator:
        condition: service_started

  worker:
    <<: *build
    working_dir: /app/services/worker
    command: node dist/index.js
    volumes:
      - ../data:/data:ro
      - uploads:/uploads
    ports:
      - "3001:3001"
    environment:
      <<: [*redis-env, *db-env]
      HEALTH_PORT: "3001"
      INFERENCE_URL: http://ai-inference:3003
      STORAGE_BASE: /uploads
    depends_on:
      redis:
        condition: service_healthy
      ai-inference:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  query-service:
    <<: *build
    working_dir: /app/services/query-service
    command: node dist/index.js
    ports:
      - "3005:3005"
    environment:
      <<: *db-env
      PORT: "3005"
      INFERENCE_URL: http://ai-inference:3003
      # Single shard for now — SHARD_URLS overrides DATABASE_URL when set
      SHARD_URLS: postgresql://docflow:docflow@postgres:5432/docflow
    depends_on:
      ai-inference:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  api-gateway:
    <<: *build
    working_dir: /app/services/api-gateway
    command: node dist/index.js
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      INGEST_URL: http://ingest-service:3004
      QUERY_URL: http://query-service:3005
      # Comma-separated list of valid API keys
      API_KEYS: "dev-key-1,dev-key-2"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW_MS: "60000"
    depends_on:
      ingest-service:
        condition: service_started
      query-service:
        condition: service_started

  seeder:
    <<: *build
    # Run from packages/queue where bullmq is a direct dependency
    working_dir: /app/packages/queue
    command: node /app/packages/queue/seed.mjs
    volumes:
      - ../data:/data:ro
    environment:
      <<: *redis-env
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

volumes:
  uploads:
