apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: docflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: docflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: DATABASE_URL
            - name: POSTGRES_DB
              value: docflow
          livenessProbe:
            exec:
              command: [pg_isready, -U, docflow]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: docflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
