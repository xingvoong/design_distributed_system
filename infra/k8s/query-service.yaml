apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: docflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: docflow/query-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: docflow-config
          env:
            - name: PORT
              value: "3005"
            - name: SHARD_URLS
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: docflow
spec:
  selector:
    app: query-service
  ports:
    - port: 3005
      targetPort: 3005
