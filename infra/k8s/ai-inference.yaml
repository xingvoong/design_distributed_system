apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: docflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      containers:
        - name: ai-inference
          image: docflow/ai-inference:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: docflow-secrets
                  key: EMBEDDING_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference
  namespace: docflow
spec:
  selector:
    app: ai-inference
  ports:
    - port: 3003
      targetPort: 3003
