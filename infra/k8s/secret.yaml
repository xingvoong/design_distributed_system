# IMPORTANT: Replace these values before deploying to production.
# Store real secrets in a secrets manager (AWS Secrets Manager, Vault, etc.)
# and inject them at deploy time — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: docflow-secrets
  namespace: docflow
type: Opaque
stringData:
  DATABASE_URL: postgresql://docflow:docflow@postgres:5432/docflow
  API_KEYS: "replace-with-real-key"
  EMBEDDING_API_KEY: "replace-with-real-key"
